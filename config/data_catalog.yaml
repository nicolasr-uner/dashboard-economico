# ═══════════════════════════════════════════════════════════════════════════════
# DATA CATALOG — Cerebro Economico NLA
# ═══════════════════════════════════════════════════════════════════════════════
# Inventario maestro de variables, fuentes, frecuencias y unidades normalizadas.
# Este archivo es la fuente de verdad para gap analysis y onboarding de series.
#
# Convenciones:
#   - Unidades monetarias: USD, COP, BRL, MXN (sin prefijos)
#   - Unidades energeticas: MWh, kWh, GW, bbl
#   - Tasas: % (siempre porcentual, no decimal)
#   - Frecuencias: daily, weekly, monthly, quarterly, annual

metadata:
  version: "1.0.0"
  last_updated: "2026-04-14"
  maintainer: "NLA Data Team"

# ── Paises Core ───────────────────────────────────────────────────────────────
countries:
  CO:
    name: Colombia
    role: core
    central_bank: Banco de la Republica
    energy_operator: XM
    stats_office: DANE
  MX:
    name: Mexico
    role: secondary
    central_bank: Banxico
    energy_operator: CENACE/SENER
    stats_office: INEGI
  BR:
    name: Brasil
    role: secondary
    central_bank: Banco Central do Brasil
    energy_operator: ONS/EPE
    stats_office: IBGE
  EC:
    name: Ecuador
    role: secondary
    central_bank: BCE
    energy_operator: CENACE Ecuador
    stats_office: INEC

# ── Categorias de Variables ───────────────────────────────────────────────────
categories:

  macro:
    display_name: "Macroeconomia"
    variables:
      - name: PIB (var. anual)
        unit: "%"
        frequency: quarterly
        sources: {CO: banrep/world_bank, MX: banxico, BR: bcb, EC: fred}
        status: {CO: partial, MX: gap, BR: ok, EC: gap}

      - name: IPC (inflacion anual)
        unit: "%"
        frequency: monthly
        sources: {CO: banrep/world_bank, MX: banxico, BR: bcb, EC: fred}
        status: {CO: partial, MX: gap, BR: ok, EC: partial}

      - name: Tasa de Desempleo
        unit: "%"
        frequency: monthly
        sources: {CO: banrep/world_bank, MX: banxico, BR: bcb}
        status: {CO: partial, MX: gap, BR: gap}

  rates_monetary:
    display_name: "Tasas y Politica Monetaria"
    variables:
      - name: Tasa de Politica Monetaria
        unit: "%"
        frequency: daily
        sources: {CO: banrep, MX: banxico/SF61745, BR: bcb/432}
        status: {CO: gap, MX: gap, BR: ok}

      - name: Tasa Interbancaria CP
        unit: "%"
        frequency: daily
        sources: {CO: banrep/IBR_ON, MX: banxico/SF43783, BR: bcb/4389}
        notes: "IBR en CO, TIIE en MX, CDI en BR"
        status: {CO: gap, MX: gap, BR: gap}

      - name: Treasury / TES 10Y (Rf)
        unit: "%"
        frequency: daily
        sources: {CO: manual, US: fred/DGS10}
        status: {CO: gap, US: gap}
        notes: "Referencia para WACC — Rf local"

  prices_inflation:
    display_name: "Precios e Inflacion"
    variables:
      - name: IPC Core
        unit: "%"
        frequency: monthly
        sources: {CO: banrep, MX: banxico/SP68258, BR: bcb/11427}
        status: {CO: gap, MX: gap, BR: gap}

      - name: IPP (var. anual)
        unit: "%"
        frequency: monthly
        sources: {CO: manual/DANE}
        status: {CO: gap}

      - name: CPI USA (referencia global)
        unit: "%"
        frequency: monthly
        sources: {WW: fred/CPIAUCSL}
        status: {WW: gap}

  fx_rates:
    display_name: "Tasas de Cambio"
    variables:
      - name: TRM (COP/USD)
        unit: "COP/USD"
        frequency: daily
        sources: {CO: banrep/superfinanciera}
        status: {CO: partial}
        notes: "BanRep API deprecada 2025 — necesita nueva fuente"

      - name: USD/MXN
        unit: "MXN/USD"
        frequency: daily
        sources: {MX: banxico/SF43718}
        status: {MX: partial}

      - name: USD/BRL
        unit: "BRL/USD"
        frequency: daily
        sources: {BR: bcb/1}
        status: {BR: ok}

      - name: EUR/USD
        unit: "EUR/USD"
        frequency: daily
        sources: {WW: fred/DEXUSEU}
        status: {WW: gap}

      - name: DXY (Indice Dolar)
        unit: "index"
        frequency: daily
        sources: {WW: fred/DTWEXBGS}
        status: {WW: gap}

  energy:
    display_name: "Sector Energetico"
    subsections:
      mercado_electrico_co:
        - name: Precio de Bolsa Nacional
          unit: "COP/kWh"
          frequency: daily
          source: xm/PrecBolNac
          status: partial

        - name: Indice Mc (contratos regulados)
          unit: "COP/kWh"
          frequency: monthly
          source: xm/PrecPromContReg
          status: gap

        - name: Demanda Nacional
          unit: "MWh"
          frequency: daily
          source: xm/DemaNal
          status: gap

        - name: Generacion Real Total
          unit: "MWh"
          frequency: daily
          source: xm/GeneReal
          status: gap

        - name: Generacion Solar
          unit: "MWh"
          frequency: daily
          source: xm/GeneSolar
          status: gap

        - name: Aportes Hidricos (% media hist.)
          unit: "%"
          frequency: daily
          source: xm/AporEner
          status: gap

        - name: Volumen Util Embalses
          unit: "%"
          frequency: daily
          source: xm/VolUtilDiari
          status: gap

        - name: Capacidad Instalada Solar
          unit: "GW"
          frequency: annual
          source: manual/UPME
          status: gap
          notes: "Fuente oficial: Plan de Expansion UPME"

        - name: Capacidad Instalada Renovable
          unit: "GW"
          frequency: annual
          source: manual/UPME
          status: gap

      commodities:
        - name: WTI Crude Oil
          unit: "USD/bbl"
          frequency: daily
          source: fred/DCOILWTICO
          status: gap

        - name: Brent Crude Oil
          unit: "USD/bbl"
          frequency: daily
          source: fred/DCOILBRENTEU
          status: gap

        - name: Henry Hub Natural Gas
          unit: "USD/MMBtu"
          frequency: daily
          source: fred/DHHNGSP
          status: gap

      # ── GAPS IDENTIFICADOS: Variables que NO existen en la DB ──
      missing_critical:
        - name: Matriz de Generacion por Fuente
          unit: "MWh"
          frequency: monthly
          proposed_source: "XM/SIMEM — dataset GeneRealFuen"
          priority: high

        - name: Demanda Proyectada (UPME)
          unit: "GWh"
          frequency: annual
          proposed_source: "UPME Plan de Expansion — PDF/manual"
          priority: high
          notes: "Proyeccion a 15 anios"

        - name: Precio PPA largo plazo (benchmark)
          unit: "USD/MWh"
          frequency: quarterly
          proposed_source: "Bloomberg NEF / LevelTen Energy"
          priority: medium

  sostenibilidad:
    display_name: "Sostenibilidad y Carbono"
    notes: "CATEGORIA NO EXISTE EN DB — GAP COMPLETO"
    missing_variables:
      - name: Intensidad de Carbono Grid CO
        unit: "tCO2/MWh"
        frequency: annual
        proposed_source: "UPME / SIN datos — Factor de Emision"
        priority: high

      - name: Penetracion FNCER (% generacion)
        unit: "%"
        frequency: monthly
        proposed_source: "XM/SIMEM — derivado de GeneRealFuen"
        priority: high

      - name: Precio Bonos de Carbono (VCS/Gold Standard)
        unit: "USD/tCO2"
        frequency: monthly
        proposed_source: "Verra Registry / Ecosystem Marketplace"
        priority: medium

      - name: I-REC Precio
        unit: "USD/MWh"
        frequency: monthly
        proposed_source: "TradeREC / mercado voluntario"
        priority: medium

      - name: Emisiones CO2 Sector Electrico CO
        unit: "MtCO2"
        frequency: annual
        proposed_source: "IDEAM (Inventario GEI) / UPME"
        priority: medium

  external:
    display_name: "Sector Externo"
    variables:
      - name: Balanza Comercial
        unit: "USD M"
        frequency: monthly
        sources: {CO: banrep, MX: banxico, BR: bcb}
        status: {CO: gap, MX: gap, BR: gap}

      - name: Cuenta Corriente (% PIB)
        unit: "% PIB"
        frequency: quarterly
        sources: {CO: fred, BR: fred, MX: fred}
        status: {CO: gap, BR: gap, MX: gap}

      - name: EMBI (Riesgo Pais)
        unit: "bps"
        frequency: daily
        sources: {CO: manual, MX: manual, BR: manual}
        status: {CO: gap, MX: gap, BR: gap}
        notes: "JP Morgan — no hay API publica gratuita"

  corporate_finance:
    display_name: "Finanzas Corporativas (Proyectos Solares)"
    notes: "Datos mayormente MANUAL/EXCEL — vinculados a modelos financieros"
    variables:
      - name: WACC
        unit: "%"
        status: estimation
      - name: Ke (Costo Equity)
        unit: "%"
        status: estimation
      - name: Kd (Costo Deuda)
        unit: "%"
        status: estimation
      - name: CAPEX Solar (USD/kWp)
        unit: "USD/kWp"
        status: estimation
      - name: Tarifa PPA
        unit: "COP/kWh"
        status: gap

# ── Fuentes Oficiales de Proyecciones Largo Plazo ─────────────────────────────
projection_sources:
  CO:
    - entity: UPME
      url: "https://www1.upme.gov.co/Paginas/plan-expansion.aspx"
      covers: [demanda_proyectada, capacidad_instalada, matriz_generacion]
      horizon: "15 anios"
      format: PDF/Excel
      update_frequency: annual

    - entity: BanRep (MMTM)
      url: "https://www.banrep.gov.co/es/modelo-macroeconomico"
      covers: [PIB, inflacion, tasa_intervencion, TRM]
      horizon: "2-3 anios"
      update_frequency: quarterly

    - entity: DANE
      url: "https://www.dane.gov.co"
      covers: [IPC, desempleo, produccion_industrial]
      update_frequency: monthly

  BR:
    - entity: EPE (Empresa de Pesquisa Energetica)
      url: "https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/plano-decenal-de-expansao-de-energia"
      covers: [demanda_proyectada, matriz_generacion, capacidad_instalada]
      horizon: "10 anios (PDE)"
      format: PDF
      update_frequency: annual

    - entity: BCB Focus
      url: "https://www.bcb.gov.br/publicacoes/focus"
      covers: [PIB, IPCA, Selic, USD_BRL]
      horizon: "4 anios"
      update_frequency: weekly

  MX:
    - entity: SENER (Secretaria de Energia)
      url: "https://www.gob.mx/sener/documentos/prodesen-2024-2038"
      covers: [demanda_proyectada, capacidad_instalada, matriz_generacion]
      horizon: "15 anios (PRODESEN)"
      format: PDF
      update_frequency: annual

    - entity: Encuesta Banxico
      url: "https://www.banxico.org.mx/publicaciones-y-prensa/encuestas-sobre-las-expectativas-de-los-especialistas"
      covers: [PIB, inflacion, tipo_cambio, tasa_objetivo]
      horizon: "2 anios"
      update_frequency: monthly

  EC:
    - entity: CENACE Ecuador
      url: "https://www.cenace.gob.ec"
      covers: [demanda, despacho]
      update_frequency: daily

    - entity: MERNNR
      url: "https://www.recursosyenergia.gob.ec"
      covers: [plan_maestro_electricidad]
      horizon: "10 anios"
      format: PDF
      update_frequency: biennial

# ── Unidades Normalizadas ─────────────────────────────────────────────────────
unit_normalization:
  energy: "MWh"
  power: "MW"
  capacity: "GW"
  currency: "USD"
  fx_rate: "local/USD"
  emissions: "tCO2"
  price_energy: "USD/MWh"
  notes: >
    Para comparabilidad regional, las series deben convertirse a las unidades
    normalizadas antes de ingresarlas en modelos econometricos. La conversion
    de COP a USD se realiza usando la TRM del dia del dato.
